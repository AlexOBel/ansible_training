---

- name: update system
  hosts: all
  become: true
  tasks:
    - name: Update packages with yum
      shell: 'yum update -y'

- name: install NGINX
  hosts: all
  become: true
  roles:
    - install_and_deploy_nginx

  vars:
    ssl_dir: /etc/nginx/ssl

- name: Install Zabbix agent using shell commands
  hosts: all
  become: yes

  tasks:
    - name: Install Zabbix repository (skip GPG check)
      ansible.builtin.shell:
        cmd: "rpm -Uvh --nogpgcheck https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-7.0-1.el9.noarch.rpm"

    - name: Import Zabbix GPG key
      ansible.builtin.shell:
        cmd: "rpm --import https://repo.zabbix.com/zabbix-official-repo.key"

    - name: Clean dnf cache
      ansible.builtin.shell:
        cmd: "dnf clean all"

    - name: Install Zabbix agent
      ansible.builtin.package:
        name: zabbix-agent
        state: present

    - name: Start and enable Zabbix agent service
      ansible.builtin.systemd:
        name: zabbix-agent
        state: started
        enabled: yes