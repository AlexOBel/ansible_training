---

- name: update system
  hosts: all
  become: true
  tasks:
    - name: Update packages with yum
      shell: 'yum update -y'

- name: install NGINX
  hosts: all
  become: true
  roles:
    - install_and_deploy_nginx

  vars:
    ssl_dir: /etc/nginx/ssl

- name: Install and configure Zabbix agent
  hosts: all
  become: yes
  vars:
    zabbix_repo_url: "https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-7.0-1.el9.noarch.rpm"

  tasks:
    - name: Install Zabbix repository
      ansible.builtin.package:
        name: "{{ zabbix_repo_url }}"
        state: present

    - name: Clean dnf cache
      ansible.builtin.command:
        cmd: dnf clean all

    - name: Install Zabbix agent
      ansible.builtin.package:
        name: zabbix-agent
        state: present
        update_cache: yes

    - name: Start and enable Zabbix agent service
      ansible.builtin.systemd:
        name: zabbix-agent
        state: started
        enabled: yes