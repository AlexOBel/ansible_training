---
# tasks file for setup keepalived
- name: Install keepalived for server
  package:
    name: keepalived
    state: latest
    update_cache: yes
  notify: start keepalived

- name: Copy main config file for keepalived
  template:
    src: ../templates/keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: 0644
  notify: restart keepalived

- name: Copy notify script for keepalived
  copy:
    src: ../templates/notify.sh
    dest: /etc/keepalived/notify.sh
    mode: 0755
  notify: restart keepalived

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  become: yes
